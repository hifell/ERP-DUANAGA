services:
  db:
    image: postgres:14
    container_name: erp_duanaga_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: odoo:17
    container_name: erp_duanaga_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - ./odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf
    networks:
      - erp_network
    environment:
      - ODOO_MASTER_PASSWD=admin_duanaga_secure_2024

  n8n:
    image: n8nio/n8n:latest
    container_name: duanaga_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    networks:
      - erp_network
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=Duanaga@2024
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678

  qc_api:
    build:
      context: ./qc_engine
      dockerfile: Dockerfile
    container_name: erp_duanaga_qc_api
    restart: unless-stopped
    ports:
      - "8003:8000"
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  erp_network:
    driver: bridge
